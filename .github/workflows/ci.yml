name: Moodle Plugin CI for auth_oidc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'MOODLE_*_STABLE'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, hetzner]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        moodle-branch: [ 'MOODLE_502_STABLE' ]
        php: [ 8.3, 8.4 ]
        database: [ pgsql, mariadb ]

    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          DB_PORT: ${{ matrix.database == 'pgsql' && job.services.postgres.ports[5432] || job.services.mariadb.ports[3306] }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          SHELLOPTS: errexit:nounset:xtrace

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Cleanup job-owned browsers
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import signal

          tracking = os.environ.get("RUNNER_TRACKING_ID")
          if not tracking or not hasattr(os, "pidfd_open") or not hasattr(signal, "pidfd_send_signal"):
              raise SystemExit("Job-owned browser cleanup identity is unavailable")
          marker = ("RUNNER_TRACKING_ID=" + tracking).encode()
          browsers = {"chrome", "chromedriver", "chrome_crashpad", "chromium", "chromium-browse", "headless_shell"}
          for process in Path("/proc").iterdir():
              if not process.name.isascii() or not process.name.isdecimal():
                  continue
              descriptor = None
              try:
                  if process.stat().st_uid != os.getuid():
                      continue
                  descriptor = os.pidfd_open(int(process.name))
                  if (process / "comm").read_text().strip() not in browsers:
                      continue
                  if marker not in (process / "environ").read_bytes().split(b"\0"):
                      continue
                  signal.pidfd_send_signal(descriptor, signal.SIGTERM)
              except (FileNotFoundError, ProcessLookupError, PermissionError):
                  continue
              finally:
                  if descriptor is not None:
                      os.close(descriptor)
          PY

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
